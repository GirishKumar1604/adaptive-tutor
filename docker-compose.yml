services:
  postgres:
    image: postgres:15
    pull_policy: never
    environment:
      POSTGRES_USER: tutor
      POSTGRES_PASSWORD: tutor
      POSTGRES_DB: tutor_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    pull_policy: never
    ports:
      - "6379:6379"

  backend:
    image: adaptive-tutor-backend:latest
    build: ./backend
    environment:
      PYTHONPATH: /app/app
      DATABASE_URL: postgresql+psycopg://tutor:tutor@postgres:5432/tutor_db
      REDIS_URL: redis://redis:6379/0
      OUTPUT_DIR: /app/app/storage/videos
      RAG_DIR: /app/app/storage/rag
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL}
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend/app:/app/app
      - ./backend/app/storage/videos:/app/app/storage/videos
      - ./backend/app/storage/rag:/app/app/storage/rag
    working_dir: /app/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    image: adaptive-tutor-worker:latest
    build: ./backend
    environment:
      PYTHONPATH: /app/app
      DATABASE_URL: postgresql+psycopg://tutor:tutor@postgres:5432/tutor_db
      REDIS_URL: redis://redis:6379/0
      OUTPUT_DIR: /app/app/storage/videos
      RAG_DIR: /app/app/storage/rag
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL}
    depends_on:
      - redis
      - postgres
    volumes:
      - ./backend/app:/app/app
      - ./backend/app/storage/videos:/app/app/storage/videos
      - ./backend/app/storage/rag:/app/app/storage/rag
    working_dir: /app/app
    command: celery -A celery_app.celery worker --loglevel=INFO

volumes:
  pgdata:
